<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | PhishGuard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand" aria-label="PhishGuard home">
        <span class="brand-mark">PG</span>
        <span>PHISHGUARD</span>
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="awareness.html">Awareness</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
      </nav>

      <div class="nav-actions">
        <a href="register.html" class="btn btn-ghost">Register</a>
        <button class="mobile-toggle" aria-label="Toggle navigation">☰</button>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      <div class="page-header">
        <span class="eyebrow">Contact Us</span>
        <h1>Get in Touch</h1>
      </div>

      <div class="contact-grid">
        <article class="contact-card glass">
          <h3>Contact Information</h3>
          <ul>
            <li><strong>Email:</strong> contact@phishguard.com</li>
            <li><strong>Phone:</strong> +1 (555) 014-2388</li>
            <li><strong>Office:</strong> Cyber Avenue, Nairobi</li>
            <li><strong>Hours:</strong> Mon-Fri, 9am-6pm</li>
          </ul>
        </article>

        <article class="contact-card glass">
          <h3>Send a Message</h3>
          <form class="contact-form" id="contactForm">
            <div class="form-group">
              <label for="name">Name</label>
              <input id="name" class="input" type="text" placeholder="Your name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" class="input" type="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input id="subject" class="input" type="text" placeholder="How can we help?" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" class="textarea" rows="6" placeholder="Write your message..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
          <div id="contactNotice" class="notice"></div>
        </article>
      </div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
