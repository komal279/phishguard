<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | PhishGuard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-box glass">
      <div class="auth-header">
        <a href="index.html" class="brand" aria-label="PhishGuard home">
          <span class="brand-mark">PG</span>
          <span>PHISHGUARD</span>
        </a>
        <h2>Create Account</h2>
        <p>Join the PhishGuard community and start protecting yourself.</p>
      </div>

      <form class="auth-form" id="registerForm" method="POST" action="php/register.php">
        <div class="form-row">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input id="fullname" class="input" type="text" name="fullname" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" class="input" type="text" name="username" placeholder="john_doe" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" class="input" type="password" name="password" placeholder="Create a strong password" required />
          <div class="password-meter">
            <span class="password-meter-bar"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" class="input" type="password" name="confirmPassword" placeholder="Confirm password" required />
        </div>

        <button class="btn btn-primary" type="submit">Create Account</button>
      </form>

      <div id="registerNotice" class="notice"></div>

      <p style="margin-top: 22px; text-align: center; color: var(--muted);">
        Already registered? <a href="login.html" style="color: var(--cyan);">Login now</a>
      </p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
