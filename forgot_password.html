<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | PhishGuard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-box glass">
      <div class="auth-header">
        <a href="index.html" class="brand" aria-label="PhishGuard home">
          <span class="brand-mark">PG</span>
          <span>PHISHGUARD</span>
        </a>
        <h2>Reset Password</h2>
        <p>Enter your email to receive a password reset link.</p>
      </div>

      <form class="auth-form">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input id="resetEmail" class="input" type="email" placeholder="you@example.com" required />
        </div>

        <button class="btn btn-primary" type="submit">Send Reset Link</button>
      </form>

      <p style="margin-top: 20px; text-align: center; color: var(--muted);">
        <a href="login.html" style="color: var(--cyan);">Back to Login</a>
      </p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
