<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PhishGuard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-box glass">
      <div class="auth-header">
        <a href="index.html" class="brand" aria-label="PhishGuard home">
          <span class="brand-mark">PG</span>
          <span>PHISHGUARD</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to continue your security analysis.</p>
      </div>

      <form class="auth-form" method="POST" action="php/login.php">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" class="input" type="password" name="password" placeholder="Enter your password" required />
        </div>

        <div class="inline-links">
          <label><input type="checkbox" name="remember" /> Remember Me</label>
          <a href="forgot_password.html">Forgot Password?</a>
        </div>

        <button class="btn btn-primary" type="submit">Login</button>
      </form>

      <div class="notice success show" id="loginNotice" style="display:none"></div>

      <p style="margin-top: 22px; text-align: center; color: var(--muted);">
        Don’t have an account? <a href="register.html" style="color: var(--cyan);">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
